<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mando de la presentación</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050b1d;color:#eaf0fb;font-family:"Segoe UI",Roboto,Arial,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;padding:16px;gap:14px;max-width:760px;margin:0 auto}
#barra{font-size:14px;color:#9fb0cf;display:flex;justify-content:space-between;align-items:center}
#luz{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d62828;margin-right:8px;vertical-align:0}
#luz.ok{background:#2E7D32}
#tarjeta{background:#0e1a3a;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
#nro{font-size:15px;color:#9fb0cf}
#quien{align-self:flex-start;padding:6px 16px;border-radius:20px;font-weight:700;font-size:20px;background:#1B365D;color:#fff}
#titulo{font-size:22px;font-weight:600;line-height:1.25}
#sigue{font-size:14px;color:#9fb0cf}
.botones{display:grid;grid-template-columns:1fr 2fr;gap:12px;flex:1;min-height:180px}
button{border:0;border-radius:18px;font-size:26px;font-weight:700;color:#fff;background:#1B365D;font-family:inherit}
button.sig{background:#2E7D32;font-size:32px}
button:active{filter:brightness(1.35)}
#entrada{display:none;flex-direction:column;gap:12px}
#entrada input{font-size:28px;padding:14px;border-radius:12px;border:1px solid #2a3a63;background:#0e1a3a;color:#fff;text-align:center;text-transform:uppercase;letter-spacing:.3em}
#entrada button{padding:14px}
small{color:#6f81a6}
</style>
</head>
<body>
<div id="barra"><span><i id="luz"></i><span id="msg">Sin conectar</span></span><span id="sala"></span></div>
<div id="entrada">
  <div>Escribí el código de sala que te pasó quien comparte pantalla.</div>
  <input id="cod" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="CÓDIGO">
  <button id="bConectar">Conectar</button>
</div>
<div id="tarjeta">
  <div id="nro">—</div>
  <div id="quien">—</div>
  <div id="titulo">Esperando la presentación…</div>
  <div id="sigue"></div>
</div>
<div class="botones">
  <button id="bAnt">◀ Anterior</button>
  <button id="bSig" class="sig">Siguiente ▶</button>
</div>
<small>Flechas, espacio o Re Pág / Av Pág también mueven la presentación.</small>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const limpiar = t => (t || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
let codigo = limpiar(new URLSearchParams(location.search).get('sala')) || limpiar(sessionStorage.getItem('sala'));
if(location.search){ if(codigo) sessionStorage.setItem('sala', codigo); history.replaceState(null, '', location.pathname); }   // el código no queda en la barra de direcciones
let peer = null, conn = null, ultimo = 0, ultimoMsg = 0;

function aviso(txt, ok){ $('msg').textContent = txt; $('luz').classList.toggle('ok', !!ok); }

function pintar(d){
  $('nro').textContent = 'Paso ' + d.paso + ' de ' + d.total;
  const q = $('quien'); q.textContent = d.quien || '—';
  const c = d.col || ['#1B365D', '#ffffff']; q.style.background = c[0]; q.style.color = c[1];
  $('titulo').textContent = d.titulo || '';
  $('sigue').textContent = d.sigue ? 'Sigue ' + d.sigue.quien + ' en el paso ' + d.sigue.paso : 'Es el último tramo';
}

let reintento = null;
function reintentar(ms, txt){                       // nunca hay más de un reintento pendiente
  aviso(txt, false);
  if(reintento) return;
  reintento = setTimeout(() => { reintento = null; abrirConexion(); }, ms);
}

function abrirConexion(){
  if(!peer || peer.destroyed) return;
  if(peer.disconnected){ try{ peer.reconnect(); }catch(_){} reintentar(3000, 'Sin conexión, reintento…'); return; }
  const viejo = conn; conn = null; if(viejo){ try{ viejo.close(); }catch(_){} }
  aviso('Conectando a ' + codigo + '…', false);
  const c = peer.connect('g10hel-' + codigo, {reliable:true}); conn = c;
  const intento = setTimeout(() => { if(conn === c && !c.open) reintentar(2500, 'No encuentro la sala ' + codigo + ', reintento…'); }, 7000);
  c.on('open', () => { if(conn !== c) return; clearTimeout(intento); ultimoMsg = Date.now(); aviso('Conectado a ' + codigo, true); c.send({a:'hola'}); });
  c.on('data', d => { if(conn === c && d && d.t === 'estado'){ ultimoMsg = Date.now(); pintar(d); } });
  c.on('close', () => { if(conn !== c) return; clearTimeout(intento); reintentar(2000, 'Se cortó, reconectando…'); });
  c.on('error', () => {});
}

function iniciar(){
  if(!codigo){ $('entrada').style.display = 'flex'; $('cod').focus(); return; }
  $('entrada').style.display = 'none'; $('sala').textContent = 'Sala ' + codigo;
  peer = new Peer();
  peer.on('open', abrirConexion);
  peer.on('disconnected', () => { try{ peer.reconnect(); }catch(_){} });
  peer.on('error', e => {
    if(e.type === 'peer-unavailable') reintentar(2500, 'No encuentro la sala ' + codigo + ', reintento…');
    else if(['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected'].includes(e.type)) reintentar(4000, 'Sin conexión, reintento…');
    else aviso('Error: ' + e.type, false);
  });
}

// si la sala deja de mandar el latido (cada 5 s), se da por cortada y se reintenta
setInterval(() => { if(conn && conn.open && Date.now() - ultimoMsg > 13000){ const c = conn; conn = null; try{ c.close(); }catch(_){} reintentar(1000, 'Se cortó, reconectando…'); } }, 3000);

function enviar(a){
  const t = Date.now(); if(t - ultimo < 250) return; ultimo = t;     // evita órdenes duplicadas por un doble toque
  if(conn && conn.open){ conn.send({a}); if(navigator.vibrate) navigator.vibrate(25); }
}
$('bSig').onclick = () => enviar('sig');
$('bAnt').onclick = () => enviar('ant');
$('bConectar').onclick = () => { codigo = $('cod').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if(codigo){ sessionStorage.setItem('sala', codigo); iniciar(); } };
document.addEventListener('keydown', e => {
  if(e.target && e.target.tagName === 'INPUT'){ if(e.key === 'Enter') $('bConectar').click(); return; }   // en el campo del código las teclas escriben
  if(['ArrowRight', ' ', 'Enter', 'PageDown'].includes(e.key)){ e.preventDefault(); enviar('sig'); }
  else if(['ArrowLeft', 'Backspace', 'PageUp'].includes(e.key)){ e.preventDefault(); enviar('ant'); }
});
if(typeof Peer === 'undefined') aviso('Sin internet: no se pudo cargar PeerJS', false); else iniciar();
</script>
</body>
</html>
